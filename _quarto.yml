project:
  type: website
  output-dir: docs

website:
  title: "ALF"
  description: "Engenharia de Dados"

  # Rodapé minimalista
  page-footer:
    background: "black"
    center:
      - text: "<b> © 2026 Alexssandro e Letícia</b>"

format:
  html:
    theme: flatly
    css: estilo/s8.css
    page-layout: full
    toc: true
    toc-location: right
    toc-title: "Nesta página"
    number-sections: true
    code-fold: true
    code-summary: "Código"
    tbl-cap-location: top

    # Grade para o PC: sem espaço morto na esquerda e Sumário fixo na direita
    grid:
      sidebar-width: 0px
      body-width: 1400px
      margin-width: 220px
      gutter-width: 1.5rem

    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Fira+Code&display=swap" rel="stylesheet">

          <style>
          details > summary {
            color: #132a13;
            font-weight: bold;
            cursor: pointer;
          }

          /* 1. DESKTOP (>= 992px): Mostra o TOC na direita e expande o painel/tabelas */
          @media (min-width: 992px) {
            #quarto-content.page-columns {
              grid-template-columns: [screen-start] 1.5rem [screen-start-inset page-start page-start-inset body-start-outset body-start] minmax(0, 1fr) [body-end body-end-outset] 1.5rem [margin-start] 220px [margin-end page-end-inset page-end screen-end-inset] 1.5rem [screen-end] !important;
            }
            .painel-fluxo-alf,
            .dataTables_wrapper {
              max-width: 100% !important;
              width: 100% !important;
              margin-left: 0 !important;
              margin-right: 0 !important;
            }
          }

          /* 2. MOBILE E TABLET (< 992px): Desativa 100% o TOC para não bugar a tela! */
          @media (max-width: 991.98px) {
            #quarto-margin-sidebar,
            #TOC,
            nav[role="doc-toc"],
            .quarto-secondary-nav,
            .quarto-btn-toggle {
              display: none !important;
              width: 0 !important;
              height: 0 !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
            }
          }
          </style>

          <!-- Rótulo "Tabela N:" / "Figura N:" das legendas e citações no texto em verde -->
          <script>
          document.addEventListener('DOMContentLoaded', function () {

            // 1) Rótulo "Tabela N:" ou "Figura N:" da legenda
            document.querySelectorAll('figure figcaption, table caption').forEach(function (cap) {
              if (cap.querySelector('.rotulo-tabela')) return;
              var m = cap.textContent.match(/^\s*(Tabela|Figura)[\s\u00a0]*\d+\s*[.:]?/);
              if (!m) return;
              var restante = m[0].length;
              var walker = document.createTreeWalker(cap, NodeFilter.SHOW_TEXT);
              var range = document.createRange();
              var n, iniciou = false;
              while ((n = walker.nextNode())) {
                if (!iniciou) { range.setStart(n, 0); iniciou = true; }
                if (n.nodeValue.length >= restante) { range.setEnd(n, restante); break; }
                restante -= n.nodeValue.length;
              }
              var span = document.createElement('span');
              span.className = 'rotulo-tabela';
              span.appendChild(range.extractContents());
              range.insertNode(span);
            });

            // 2) Citação no texto: links "Tabela N" ou "Figura N"
            document.querySelectorAll('a').forEach(function (a) {
              if (/^(Tabela|Figura)[\s\u00a0]*\d+$/.test(a.textContent.trim())) {
                a.classList.add('citacao-tabela');
                a.style.setProperty('color', 'var(--cor-rotulo-tabela, #0a7d4f)', 'important');
              }
            });

          });
          </script>

execute:
  freeze: false
  message: false
  warning: false

lang: pt